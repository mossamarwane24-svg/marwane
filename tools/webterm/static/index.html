<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Terminal tablette</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section id="login" class="hidden" aria-labelledby="login-title">
      <form id="login-form" autocomplete="on">
        <h1 id="login-title">Terminal tablette</h1>
        <label for="pw">Mot de passe</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrer</button>
        <p id="login-error" role="alert"></p>
      </form>
    </section>

    <section id="app" class="hidden">
      <header>
        <span class="title">Terminal · marwane</span>
        <div id="tools" class="tools">
          <button type="button" data-action="smaller" title="Texte plus petit">A−</button>
          <button type="button" data-action="bigger" title="Texte plus grand">A+</button>
          <button type="button" data-action="restart" title="Nouvelle session">↻</button>
          <button type="button" data-action="logout" title="Se déconnecter">Quitter</button>
        </div>
      </header>
      <main id="terminal"></main>
      <nav id="keys" aria-label="Touches spéciales">
        <button type="button" data-key="esc">esc</button>
        <button type="button" data-key="tab">tab</button>
        <button type="button" data-key="ctrl" id="ctrl">ctrl</button>
        <button type="button" data-key="ctrl-c">^C</button>
        <button type="button" data-key="ctrl-d">^D</button>
        <button type="button" data-key="up">↑</button>
        <button type="button" data-key="down">↓</button>
        <button type="button" data-key="left">←</button>
        <button type="button" data-key="right">→</button>
        <button type="button" data-key="pipe">|</button>
        <button type="button" data-key="tilde">~</button>
        <button type="button" data-key="slash">/</button>
        <button type="button" data-key="enter">entrée</button>
      </nav>
    </section>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
